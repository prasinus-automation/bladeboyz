<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%231a1a2e'/%3E%3Cg stroke='%23c0c0c0' stroke-width='2' stroke-linecap='round'%3E%3Cline x1='7' y1='5' x2='22' y2='20' /%3E%3Cline x1='25' y1='5' x2='10' y2='20' /%3E%3C/g%3E%3Cg stroke='%238b7355' stroke-width='2.5' stroke-linecap='round'%3E%3Cline x1='22' y1='20' x2='26' y2='24' /%3E%3Cline x1='10' y1='20' x2='6' y2='24' /%3E%3C/g%3E%3Cg stroke='%23c0c0c0' stroke-width='1'%3E%3Cline x1='19' y1='18' x2='25' y2='18' /%3E%3Cline x1='7' y1='18' x2='13' y2='18' /%3E%3C/g%3E%3C/svg%3E">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <title>BladeBoyz</title>
    <style>
      /*
       * CSS custom properties mirror src/hud/theme.ts. Keep them in sync —
       * see issue #101 for the migration policy. HUD.ts also reads from
       * theme.ts directly; this :root block lets index.html's static styles
       * pick up the same values without bundling theme.ts into HTML.
       */
      :root {
        --bb-font: monospace;
        --bb-bg-black: #000;
        --bb-bg-backdrop: rgba(0, 0, 0, 0.7);
        --bb-text-inverse: #fff;
        --bb-status-good: #0f0;
        --bb-status-warn: #ff0;
        --bb-z-hud: 10;
        --bb-z-prompt: 100;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bb-bg-black); }
      canvas { display: block; width: 100%; height: 100%; }
      #click-to-play {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bb-bg-backdrop);
        color: var(--bb-text-inverse);
        font-family: var(--bb-font);
        font-size: 24px;
        cursor: pointer;
        z-index: var(--bb-z-prompt);
        user-select: none;
      }
      #click-to-play.hidden { display: none; }
      #crosshair {
        position: fixed;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        width: 2px; height: 2px;
        background: var(--bb-text-inverse);
        box-shadow:
          0 -6px 0 var(--bb-text-inverse),
          0  6px 0 var(--bb-text-inverse),
          -6px 0 0 var(--bb-text-inverse),
          6px  0 0 var(--bb-text-inverse);
        z-index: var(--bb-z-hud);
        pointer-events: none;
      }
      #debug-overlay {
        position: fixed;
        top: 8px; left: 8px;
        color: var(--bb-status-good);
        font-family: var(--bb-font);
        font-size: 12px;
        z-index: var(--bb-z-hud);
        pointer-events: none;
        white-space: pre;
      }
      #camera-mode-indicator {
        position: fixed;
        top: 8px; right: 8px;
        color: var(--bb-status-warn);
        font-family: var(--bb-font);
        font-size: 12px;
        z-index: var(--bb-z-hud);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <!--
      The legacy "click to play" overlay is the *lost-pointer-lock* hint for
      mid-game lock loss (ESC pressed during play, alt-tab, etc.). It starts
      hidden — the entry overlay is now `MainMenu` (issue #106). When the
      player loses pointer lock mid-game `InputManager._onPointerLockChange`
      removes `.hidden` so this prompt re-appears.
    -->
    <div id="click-to-play" class="hidden">Click to Play</div>
    <div id="crosshair"></div>
    <div id="debug-overlay"></div>
    <div id="camera-mode-indicator">FPS</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
